[workspace.package]
edition = "2024"

[workspace]
members = [
    "ndk-build",
    "ndk-examples",
    "cargo-apk",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.57"
cargo-subcommand = "0.12"
clap = { version = "4.6.2", features = ["derive"] }
dunce = "1"
env_logger = "0.11.11"
log = "0.4"
toml = "1.1.8"
dirs = "7"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
which = "8.0.6"
